name: Verify plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify runtime checksum
        run: sha256sum --check audit/omarchy-ui-runtime.sha256
      - name: Verify signed runtime provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify omarchy-ui-runtime --repo AdamMusa/omarchy-ui
      - name: Compare immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/runtime-release"
          gh release download runtime-v0.1.4 --repo AdamMusa/omarchy-ui \
            --pattern omarchy-ui-runtime --dir "$RUNNER_TEMP/runtime-release"
          cmp omarchy-ui-runtime "$RUNNER_TEMP/runtime-release/omarchy-ui-runtime"
      - name: Check Ruby syntax
        run: |
          for ruby_file in main.rb config.rb lib/*.rb; do ruby -c "$ruby_file"; done
      - name: Verify compiled QML package
        run: |
          sha256sum --check audit/omarchy-ui-qml-bundle.sha256
          test ! -e ControlNode.qml
          test ! -d Components
          test "$(find . -maxdepth 1 -name '*.qml' | wc -l)" -eq 3
          jq -e '.format == "qt-aot-qml-module" and .format_version == 1 and (.artifacts | length == 2)' audit/omarchy-ui-qml-bundle.json
      - name: Check manifest contract
        run: jq -e '.schemaVersion == 1 and (.kinds | length == 3)' manifest.json

  reproduce_qml:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Rebuild and compare the QML ELF artifacts
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$PWD:/workspace" --workdir /workspace \
            docker.io/library/archlinux@sha256:818793c894d94534c22f2149154a39ebaee57e4e67321023b0866a1d5722036c \
            bash -lc '
              set -euo pipefail
              sed -i '\''1,$c\Server = https://archive.archlinux.org/repos/2026/08/23/$repo/os/$arch'\'' \
                /etc/pacman.d/mirrorlist
              pacman -Syyuu --noconfirm
              pacman -S --needed --noconfirm \
                qt6-declarative cmake ninja gcc binutils diffutils jq

              quickshell_package=/tmp/quickshell.pkg.tar.zst
              curl --fail --location --silent --show-error \
                https://pkgs.omarchy.org/stable/x86_64/quickshell-git-0.3.0.r20.g28771c7-2-x86_64.pkg.tar.zst \
                --output "$quickshell_package"
              echo "048cc4a3d54bd164b8589f756eb075f0688d9bd24949b734a5edb4e217b8ba30  $quickshell_package" \
                | sha256sum --check
              bsdtar -xf "$quickshell_package" -C /

              audit/rebuild-qml-bundle.sh
            '
      - name: Attest the reproduced QML artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: audit/omarchy-ui-qml-bundle.sha256
